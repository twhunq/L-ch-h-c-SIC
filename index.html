<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="description" content="Lịch học SIC2026 ICTU – theo dõi nhanh" />
  <title>Lịch học SIC2026</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0b1220;
      --card: #131c2e;
      --line: rgba(148, 163, 184, 0.16);
      --text: #f1f5f9;
      --muted: #94a3b8;
      --blue: #38bdf8;
      --green: #4ade80;
      --amber: #fbbf24;
      --rose: #fb7185;
      --accent: #2563eb;
      --safe: env(safe-area-inset-bottom, 0px);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Be Vietnam Pro", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.45;
      -webkit-font-smoothing: antialiased;
    }
    .wrap {
      max-width: 480px;
      margin: 0 auto;
      padding: 16px 16px calc(24px + var(--safe));
    }

    /* Top bar */
    .top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 16px;
    }
    .top h1 {
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    .top .sub {
      color: var(--muted);
      font-size: 0.78rem;
      margin-top: 2px;
    }
    .btn-refresh {
      border-radius: 12px;
      border: 1px solid var(--line);
      background: var(--card);
      color: var(--blue);
      font: inherit;
      font-size: 0.82rem;
      font-weight: 600;
      padding: 8px 12px;
      cursor: pointer;
      flex-shrink: 0;
      white-space: nowrap;
    }
    .btn-refresh:disabled { opacity: 0.5; cursor: wait; }

    /* Focus card – buổi quan trọng nhất */
    .focus {
      border-radius: 18px;
      padding: 18px;
      margin-bottom: 14px;
      background: linear-gradient(145deg, #1d4ed8, #0ea5e9);
      box-shadow: 0 12px 32px rgba(37, 99, 235, 0.28);
    }
    .focus.ongoing { background: linear-gradient(145deg, #b45309, #ea580c); }
    .focus.ending { background: linear-gradient(145deg, #c2410c, #dc2626); }
    .focus.done { background: linear-gradient(145deg, #0f766e, #059669); }
    .focus.empty { background: var(--card); border: 1px solid var(--line); }
    .focus .tag {
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      opacity: 0.92;
      margin-bottom: 6px;
    }
    .focus h2 {
      font-size: 1.12rem;
      font-weight: 700;
      line-height: 1.35;
      margin-bottom: 12px;
    }
    .focus .rows {
      display: grid;
      gap: 6px;
      font-size: 0.9rem;
      font-weight: 500;
    }
    .focus .rows div {
      display: flex;
      gap: 8px;
      align-items: flex-start;
    }
    .focus .hint {
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px solid rgba(255,255,255,0.2);
      font-size: 0.82rem;
      opacity: 0.95;
    }

    /* Filters */
    .filters {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
      overflow-x: auto;
      padding-bottom: 2px;
      -webkit-overflow-scrolling: touch;
    }
    .filters button {
      flex: 0 0 auto;
      border: 1px solid var(--line);
      background: transparent;
      color: var(--muted);
      border-radius: 999px;
      padding: 8px 14px;
      font: inherit;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
    }
    .filters button.on {
      background: rgba(56, 189, 248, 0.15);
      border-color: rgba(56, 189, 248, 0.35);
      color: var(--blue);
    }

    /* Class list */
    .list { display: flex; flex-direction: column; gap: 10px; }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      overflow: hidden;
    }
    .card.today { border-color: rgba(56, 189, 248, 0.45); }
    .card.past { opacity: 0.55; }
    .card-main {
      display: grid;
      grid-template-columns: 56px 1fr;
      gap: 12px;
      padding: 14px;
      cursor: pointer;
    }
    .datebox {
      text-align: center;
      background: rgba(255,255,255,0.04);
      border-radius: 12px;
      padding: 8px 4px;
      border: 1px solid var(--line);
    }
    .card.today .datebox {
      background: rgba(37, 99, 235, 0.25);
      border-color: rgba(56, 189, 248, 0.3);
    }
    .datebox .d { font-size: 1.2rem; font-weight: 700; line-height: 1.1; }
    .datebox .m { font-size: 0.68rem; color: var(--muted); margin-top: 2px; }
    .body .wd {
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--blue);
      margin-bottom: 2px;
    }
    .body .wd .badge {
      display: inline-block;
      margin-left: 6px;
      padding: 1px 6px;
      border-radius: 6px;
      font-size: 0.68rem;
      background: rgba(56, 189, 248, 0.15);
      color: var(--blue);
    }
    .body .wd .badge.live {
      background: rgba(251, 113, 133, 0.18);
      color: var(--rose);
    }
    .body h3 {
      font-size: 0.92rem;
      font-weight: 600;
      line-height: 1.35;
      margin-bottom: 8px;
    }
    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .meta span {
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--muted);
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 3px 8px;
    }
    .meta span.hi { color: var(--blue); border-color: rgba(56,189,248,0.25); }

    .detail {
      display: none;
      border-top: 1px solid var(--line);
      padding: 10px 14px 14px;
      background: rgba(0,0,0,0.18);
    }
    .card.open .detail { display: block; }
    .detail .item {
      padding: 8px 0;
      border-bottom: 1px solid var(--line);
      font-size: 0.85rem;
    }
    .detail .item:last-child { border-bottom: none; }
    .detail .item b {
      display: block;
      font-weight: 600;
      margin-bottom: 2px;
    }
    .detail .item p {
      color: var(--muted);
      font-size: 0.8rem;
      white-space: pre-wrap;
    }
    .detail .toggle-more {
      margin-top: 6px;
      border: none;
      background: none;
      color: var(--blue);
      font: inherit;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      padding: 0;
    }

    .empty {
      text-align: center;
      padding: 36px 16px;
      color: var(--muted);
      border: 1px dashed var(--line);
      border-radius: 16px;
      font-size: 0.9rem;
    }

    .foot {
      margin-top: 20px;
      text-align: center;
      color: var(--muted);
      font-size: 0.72rem;
      line-height: 1.5;
    }
    .foot a { color: var(--blue); text-decoration: none; }

    .loading {
      text-align: center;
      padding: 80px 20px;
      color: var(--muted);
    }
    .spin {
      width: 32px; height: 32px;
      margin: 0 auto 12px;
      border: 3px solid rgba(56,189,248,0.2);
      border-top-color: var(--blue);
      border-radius: 50%;
      animation: sp 0.7s linear infinite;
    }
    @keyframes sp { to { transform: rotate(360deg); } }

    .toast {
      position: fixed;
      left: 50%;
      bottom: calc(20px + var(--safe));
      transform: translateX(-50%) translateY(12px);
      background: #1e293b;
      border: 1px solid var(--line);
      color: #fff;
      padding: 10px 16px;
      border-radius: 12px;
      font-size: 0.82rem;
      font-weight: 600;
      opacity: 0;
      pointer-events: none;
      transition: 0.2s;
      z-index: 20;
      max-width: 90%;
    }
    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>
<body>
  <div class="wrap" id="app">
    <div class="loading"><div class="spin"></div>Đang tải lịch…</div>
  </div>
  <div class="toast" id="toast"></div>

  <script>
    const SHEET_CSV =
      "https://docs.google.com/spreadsheets/d/1nnYhUeWdgkSE8wZvagctTT28VT7nyTUd9e3gDi8m-4s/gviz/tq?tqx=out:csv&gid=1271431527";

    let state = {
      data: null,
      filter: "upcoming", // upcoming | all
      open: {}, // date -> bool
    };

    function toast(msg) {
      const el = document.getElementById("toast");
      el.textContent = msg;
      el.classList.add("show");
      clearTimeout(toast._t);
      toast._t = setTimeout(() => el.classList.remove("show"), 2000);
    }

    function esc(s) {
      return String(s ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function parseDateVN(s) {
      if (!s) return null;
      const m = String(s).trim().match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})$/);
      if (m) return new Date(+m[3], +m[2] - 1, +m[1]);
      const d = new Date(s);
      return isNaN(d) ? null : d;
    }

    function parseHm(part, defH, defM) {
      const m = String(part || "").match(/(\d{1,2})[h:](\d{2})/i);
      return m ? { h: +m[1], m: +m[2] } : { h: defH, m: defM };
    }

    function bounds(day) {
      const d = parseDateVN(day.date_iso || day.date);
      if (!d) return null;
      const t = String(day.time || "18h00-21h00");
      const [a, b] = t.split("-");
      const s = parseHm(a, 18, 0);
      const e = parseHm(b, 21, 0);
      const start = new Date(d.getFullYear(), d.getMonth(), d.getDate(), s.h, s.m);
      const end = new Date(d.getFullYear(), d.getMonth(), d.getDate(), e.h, e.m);
      return { start, end };
    }

    function classFocus(days) {
      const now = new Date();
      const items = (days || [])
        .map((day) => ({ day, b: bounds(day) }))
        .filter((x) => x.b)
        .sort((a, b) => a.b.start - b.b.start);

      for (const it of items) {
        if (it.b.start <= now && now < it.b.end) {
          const minsLeft = Math.max(0, Math.round((it.b.end - now) / 60000));
          const idx = items.indexOf(it);
          return {
            status: minsLeft <= 30 ? "ending" : "ongoing",
            day: it.day,
            minsLeft,
            next: items[idx + 1]?.day || null,
          };
        }
      }
      for (const it of items) {
        if (it.b.start > now) {
          const minsUntil = Math.round((it.b.start - now) / 60000);
          return { status: "upcoming", day: it.day, minsUntil, next: null };
        }
      }
      return { status: "none", day: null, next: null };
    }

    function isToday(day) {
      const d = parseDateVN(day.date_iso || day.date);
      if (!d) return false;
      const n = new Date();
      return d.getFullYear() === n.getFullYear() &&
        d.getMonth() === n.getMonth() &&
        d.getDate() === n.getDate();
    }

    function isPast(day) {
      const b = bounds(day);
      if (!b) return false;
      return b.end < new Date();
    }

    function isUpcomingOrToday(day) {
      return !isPast(day);
    }

    // ── CSV (live) ──
    function parseCsv(text) {
      const rows = [];
      let row = [], cell = "", i = 0, inQ = false;
      while (i < text.length) {
        const c = text[i];
        if (inQ) {
          if (c === '"') {
            if (text[i + 1] === '"') { cell += '"'; i += 2; continue; }
            inQ = false; i++; continue;
          }
          cell += c; i++; continue;
        }
        if (c === '"') { inQ = true; i++; continue; }
        if (c === ",") { row.push(cell); cell = ""; i++; continue; }
        if (c === "\n" || c === "\r") {
          if (c === "\r" && text[i + 1] === "\n") i++;
          row.push(cell); rows.push(row); row = []; cell = ""; i++; continue;
        }
        cell += c; i++;
      }
      if (cell.length || row.length) { row.push(cell); rows.push(row); }
      return rows;
    }

    function buildFromCsv(text) {
      const rows = parseCsv(text);
      if (!rows.length) throw new Error("CSV rỗng");
      const dataRows = rows.slice(1).map((r) => {
        while (r.length < 10) r.push("");
        return {
          so_tiet: (r[0] || "").trim(),
          chu_de_ngay: (r[1] || "").trim(),
          chu_de_tiet: (r[2] || "").trim(),
          noi_dung: (r[3] || "").trim(),
          tai_lieu: (r[4] || "").trim(),
          type: (r[5] || "").trim(),
          date: (r[6] || "").trim(),
          lecturer: (r[7] || "").trim(),
          time: (r[8] || "").trim(),
          classroom: (r[9] || "").trim(),
        };
      });

      let curDate = "", curTopic = "", curLec = "", curTime = "", curRoom = "", curType = "", curMat = "";
      const lessons = [];
      for (const r of dataRows) {
        if (r.chu_de_ngay && r.chu_de_ngay !== curTopic) {
          curDate = r.date || "";
          curTopic = r.chu_de_ngay;
        } else if (r.date) curDate = r.date;
        if (r.lecturer) curLec = r.lecturer;
        if (r.time) curTime = r.time;
        if (r.classroom) curRoom = r.classroom;
        if (r.type) curType = r.type;
        if (r.tai_lieu) curMat = r.tai_lieu;
        if (!r.chu_de_tiet && !r.noi_dung && !r.so_tiet) continue;
        if (r.so_tiet && !r.chu_de_tiet && !r.noi_dung) continue;
        lessons.push({
          day_topic: curTopic,
          lesson_topic: r.chu_de_tiet,
          content: r.noi_dung,
          so_tiet: r.so_tiet,
          date: curDate,
          lecturer: curDate ? curLec : "",
          time: curDate ? curTime : "",
          classroom: curDate ? curRoom : "",
          type: curType,
          material: curMat,
          scheduled: !!curDate,
        });
      }

      const map = new Map();
      for (const les of lessons) {
        if (!les.scheduled) continue;
        if (!map.has(les.date)) {
          map.set(les.date, {
            date: les.date,
            date_iso: null,
            weekday: null,
            day_topic: les.day_topic,
            lecturer: les.lecturer,
            time: les.time || "18h00-21h00",
            classroom: les.classroom,
            type: les.type || "Offline",
            material: les.material,
            lessons: [],
          });
        }
        const day = map.get(les.date);
        for (const f of ["lecturer", "time", "classroom", "type", "material", "day_topic"]) {
          if (les[f]) day[f] = les[f];
        }
        if (les.lesson_topic || les.content) {
          day.lessons.push({
            so_tiet: les.so_tiet,
            title: les.lesson_topic,
            content: les.content,
          });
        }
      }

      const WD = ["Chủ nhật", "Thứ 2", "Thứ 3", "Thứ 4", "Thứ 5", "Thứ 6", "Thứ 7"];
      const days = [...map.values()].map((day) => {
        const dt = parseDateVN(day.date);
        if (dt) {
          day.date_iso = `${dt.getFullYear()}-${String(dt.getMonth() + 1).padStart(2, "0")}-${String(dt.getDate()).padStart(2, "0")}`;
          day.weekday = WD[dt.getDay()];
          day.sort_key = day.date_iso;
        } else day.sort_key = day.date;
        return day;
      }).sort((a, b) => a.sort_key.localeCompare(b.sort_key));

      return {
        course: "SIC2026 ICTU",
        source: "https://docs.google.com/spreadsheets/d/1nnYhUeWdgkSE8wZvagctTT28VT7nyTUd9e3gDi8m-4s/edit#gid=1271431527",
        updated_at: new Date().toISOString(),
        days,
      };
    }

    async function loadData(forceLive = false) {
      if (forceLive) {
        const res = await fetch(SHEET_CSV + "&_=" + Date.now(), { cache: "no-store" });
        if (!res.ok) throw new Error("HTTP " + res.status);
        const text = await res.text();
        if (!text || text.includes("<!DOCTYPE")) throw new Error("Sheet lỗi");
        return buildFromCsv(text);
      }
      try {
        const res = await fetch("schedule.json?_=" + Date.now());
        if (res.ok) return await res.json();
      } catch (_) {}
      const res = await fetch(SHEET_CSV + "&_=" + Date.now());
      if (!res.ok) throw new Error("Không tải được lịch");
      return buildFromCsv(await res.text());
    }

    // ── UI ──
    function focusHtml(focus) {
      if (!focus || focus.status === "none" || !focus.day) {
        return `
          <section class="focus empty">
            <div class="tag">Lịch học</div>
            <h2>Không còn buổi sắp tới</h2>
            <div class="rows"><div>Chờ cập nhật lịch Chủ nhật</div></div>
          </section>`;
      }

      const d = focus.day;
      let cls = "";
      let tag = "Buổi sắp tới";
      let hint = "";

      if (focus.status === "ending") {
        cls = "ending";
        tag = `Đang học · sắp kết thúc (~${focus.minsLeft}p)`;
        if (focus.next) {
          hint = `Buổi kế: <b>${esc(focus.next.date)}</b> · ${esc(focus.next.day_topic)}`;
        }
      } else if (focus.status === "ongoing") {
        cls = "ongoing";
        tag = "Đang trong giờ học";
        hint = `Kết thúc lúc ${esc((d.time || "").split("-")[1] || "21h00")}`;
      } else {
        if (focus.minsUntil != null && focus.minsUntil < 60) {
          tag = `Sắp học · còn ~${focus.minsUntil} phút`;
        } else if (focus.minsUntil != null && focus.minsUntil < 24 * 60) {
          tag = `Buổi sắp tới · còn ~${Math.floor(focus.minsUntil / 60)} giờ`;
        }
      }

      return `
        <section class="focus ${cls}">
          <div class="tag">${esc(tag)}</div>
          <h2>${esc(d.day_topic)}</h2>
          <div class="rows">
            <div>📅 ${esc(d.weekday)} · ${esc(d.date)}</div>
            <div>⏰ ${esc(d.time || "18h00-21h00")}</div>
            <div>📍 Phòng <b>${esc(d.classroom || "—")}</b></div>
            <div>👤 ${esc(d.lecturer || "—")}</div>
          </div>
          ${hint ? `<div class="hint">${hint}</div>` : ""}
        </section>`;
    }

    function cardHtml(day) {
      const d = parseDateVN(day.date_iso || day.date);
      const dd = d ? String(d.getDate()).padStart(2, "0") : "—";
      const mm = d ? `Th${d.getMonth() + 1}` : "";
      const today = isToday(day);
      const past = isPast(day);
      const open = !!state.open[day.date];
      const lessons = day.lessons || [];

      let badge = "";
      const now = new Date();
      const b = bounds(day);
      if (b && b.start <= now && now < b.end) {
        badge = `<span class="badge live">Đang học</span>`;
      } else if (today && !past) {
        badge = `<span class="badge">Hôm nay</span>`;
      }

      const lessonsHtml = lessons
        .map((les, i) => {
          const n = les.so_tiet || String(i + 1);
          const content = les.content
            ? `<p class="c" hidden>${esc(les.content)}</p><button type="button" class="toggle-more" data-more>Xem nội dung</button>`
            : "";
          return `
            <div class="item">
              <b>${esc(n)}. ${esc(les.title || "Nội dung")}</b>
              ${content}
            </div>`;
        })
        .join("");

      return `
        <article class="card ${today ? "today" : ""} ${past ? "past" : ""} ${open ? "open" : ""}" data-date="${esc(day.date)}">
          <div class="card-main" data-toggle="${esc(day.date)}">
            <div class="datebox">
              <div class="d">${dd}</div>
              <div class="m">${mm}</div>
            </div>
            <div class="body">
              <div class="wd">${esc(day.weekday || "")}${badge}</div>
              <h3>${esc(day.day_topic)}</h3>
              <div class="meta">
                <span class="hi">⏰ ${esc(day.time || "18h00-21h00")}</span>
                <span>📍 ${esc(day.classroom || "—")}</span>
                <span>${lessons.length} tiết</span>
              </div>
            </div>
          </div>
          <div class="detail">
            <div class="meta" style="margin-bottom:8px">
              <span>👤 ${esc(day.lecturer || "—")}</span>
              <span>${esc(day.type || "Offline")}</span>
            </div>
            ${lessonsHtml || `<div class="item"><b>Chưa có tiết chi tiết</b></div>`}
          </div>
        </article>`;
    }

    function render() {
      const app = document.getElementById("app");
      if (!state.data) {
        app.innerHTML = `<div class="loading"><div class="spin"></div>Đang tải lịch…</div>`;
        return;
      }

      const days = state.data.days || [];
      const focus = classFocus(days);
      const list =
        state.filter === "upcoming"
          ? days.filter(isUpcomingOrToday)
          : days;

      const updated = state.data.updated_at
        ? new Date(state.data.updated_at).toLocaleString("vi-VN", {
            day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit",
          })
        : "—";

      app.innerHTML = `
        <header class="top">
          <div>
            <h1>Lịch học SIC</h1>
            <div class="sub">${esc(state.data.course || "SIC2026")} · ${esc(updated)}</div>
          </div>
          <button class="btn-refresh" id="btnRefresh" type="button" title="Làm mới từ Sheet">Cập nhật lịch học</button>
        </header>

        ${focusHtml(focus)}

        <div class="filters">
          <button type="button" data-filter="upcoming" class="${state.filter === "upcoming" ? "on" : ""}">Sắp tới</button>
          <button type="button" data-filter="all" class="${state.filter === "all" ? "on" : ""}">Tất cả</button>
        </div>

        <div class="list">
          ${
            list.length
              ? list.map(cardHtml).join("")
              : `<div class="empty">Không có buổi trong mục này</div>`
          }
        </div>

        <footer class="foot">
          Lịch cập nhật <b>Chủ nhật</b> · có thể đổi đến trước học <b>2 tiếng</b><br/>
          <a href="${esc(state.data.source || "#")}" target="_blank" rel="noopener">Google Sheet</a>
          · Bot Telegram: <a href="https://t.me/sicictu_bot" target="_blank" rel="noopener">@sicictu_bot</a>
        </footer>
      `;

      document.getElementById("btnRefresh")?.addEventListener("click", async () => {
        const btn = document.getElementById("btnRefresh");
        btn.disabled = true;
        btn.textContent = "Đang tải…";
        try {
          state.data = await loadData(true);
          toast("Đã cập nhật lịch");
          render();
        } catch (e) {
          toast("Không tải được Sheet");
          btn.disabled = false;
          btn.textContent = "Cập nhật lịch học";
        }
      });

      document.querySelectorAll("[data-filter]").forEach((btn) => {
        btn.addEventListener("click", () => {
          state.filter = btn.getAttribute("data-filter");
          render();
        });
      });

      document.querySelectorAll("[data-toggle]").forEach((el) => {
        el.addEventListener("click", () => {
          const date = el.getAttribute("data-toggle");
          state.open[date] = !state.open[date];
          render();
        });
      });

      document.querySelectorAll("[data-more]").forEach((btn) => {
        btn.addEventListener("click", (e) => {
          e.stopPropagation();
          const p = btn.parentElement.querySelector(".c");
          if (!p) return;
          const show = p.hasAttribute("hidden");
          if (show) p.removeAttribute("hidden");
          else p.setAttribute("hidden", "");
          btn.textContent = show ? "Ẩn nội dung" : "Xem nội dung";
        });
      });
    }

    async function boot() {
      try {
        state.data = await loadData(false);
        render();
      } catch (e) {
        document.getElementById("app").innerHTML = `
          <div class="empty" style="margin-top:40px">
            <p style="margin-bottom:8px;color:var(--text);font-weight:600">Không tải được lịch</p>
            <p>${esc(e.message)}</p>
          </div>`;
      }
    }

    boot();
    // tự làm mới focus mỗi phút (đếm ngược đang học)
    setInterval(() => {
      if (state.data) render();
    }, 60000);
  </script>
</body>
</html>
